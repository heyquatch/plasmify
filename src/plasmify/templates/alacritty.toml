# Generated by Plasmify ({{ name }}). Re-applying a preset overwrites this file.

[general]
live_config_reload = true

[window]
padding = { x = {{ padding }}, y = {{ padding }} }
dynamic_padding = true
opacity = {{ opacity }}
blur = {{ blur }}
decorations_theme_variant = "Dark"

[font]
normal = { family = "{{ font }}", style = "Regular" }
bold = { family = "{{ font }}", style = "Bold" }
italic = { family = "{{ font }}", style = "Italic" }
size = {{ font_size }}

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[selection]
save_to_clipboard = true
{{ alacritty_shell }}

[colors.primary]
background = "{{ base }}"
foreground = "{{ text }}"

[colors.cursor]
text = "{{ base }}"
cursor = "{{ accent }}"

[colors.selection]
text = "{{ crust }}"
background = "{{ accent }}"

[colors.normal]
black = "{{ ansi_black }}"
red = "{{ red }}"
green = "{{ green }}"
yellow = "{{ yellow }}"
blue = "{{ blue }}"
magenta = "{{ magenta }}"
cyan = "{{ cyan }}"
white = "{{ ansi_white }}"

[colors.bright]
black = "{{ ansi_bright_black }}"
red = "{{ bright_red }}"
green = "{{ bright_green }}"
yellow = "{{ bright_yellow }}"
blue = "{{ bright_blue }}"
magenta = "{{ bright_magenta }}"
cyan = "{{ bright_cyan }}"
white = "{{ ansi_bright_white }}"
