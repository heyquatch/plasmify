"$schema" = "https://starship.rs/config-schema.json"

format = """
[]({{ accent }})\
$os\
$username\
[](bg:{{ blue }} fg:{{ accent }})\
$directory\
[](fg:{{ blue }} bg:{{ surface }})\
$git_branch\
$git_status\
[](fg:{{ surface }} bg:{{ mantle }})\
$cmd_duration\
$time\
[ ](fg:{{ mantle }})\
$line_break$character"""

[os]
disabled = false
style = "bg:{{ accent }} fg:{{ crust }}"

[username]
show_always = true
style_user = "bg:{{ accent }} fg:{{ crust }}"
style_root = "bg:{{ accent }} fg:{{ crust }}"
format = "[ $user ]($style)"

[directory]
style = "bg:{{ blue }} fg:{{ crust }}"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:{{ surface }}"
format = "[[ $symbol $branch ](fg:{{ green }} bg:{{ surface }})]($style)"

[git_status]
style = "bg:{{ surface }}"
format = "[[($all_status$ahead_behind )](fg:{{ green }} bg:{{ surface }})]($style)"

[cmd_duration]
min_time = 2000
format = "[[ 󱎫 $duration ](fg:{{ yellow }} bg:{{ mantle }})]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:{{ mantle }}"
format = "[[  $time ](fg:{{ subtext }} bg:{{ mantle }})]($style)"

[character]
success_symbol = "[❯](bold fg:{{ green }})"
error_symbol = "[❯](bold fg:{{ red }})"
