# Generated by Plasmify. Re-applying a preset overwrites this file.
"$schema" = "https://starship.rs/config-schema.json"

format = "$directory$git_branch$git_status$cmd_duration$line_break$character"
add_newline = true

[directory]
style = "bold {{ accent }}"
truncation_length = 3

[git_branch]
symbol = " "
style = "{{ green }}"
format = "[$symbol$branch]($style) "

[git_status]
style = "{{ yellow }}"

[cmd_duration]
format = "[$duration]({{ subtext }}) "

[character]
success_symbol = "[❯]({{ accent }})"
error_symbol = "[❯]({{ red }})"
