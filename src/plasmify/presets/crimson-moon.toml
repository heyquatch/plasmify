schema = 1

[meta]
id = "crimson-moon"
name = "Crimson Moon"
description = "Black, crimson and gold under a crescent moon, gold shooting stars over a living wallpaper and frosted glass windows. Add your own character art in Customize and pick a Shimmer style."
tags = ["crimson", "gold", "moon", "dark"]

# A Plasmify palette: near black with ivory text, a gold accent (crust on gold reads well for
# selections) and crimson through red, the panel border and the wallpapers.
[palette]
base = "#0e0a0b"
mantle = "#090607"
crust = "#040203"
surface = "#24171a"
overlay = "#7a6467"
text = "#f0e6d8"
subtext = "#c4b4a4"
accent = "#d6a84e"
red = "#dc3d55"
green = "#9fb36f"
yellow = "#e8c46a"
blue = "#86a3cc"
magenta = "#d07a98"
cyan = "#7dbcb4"
orange = "#e48f4e"
bright_black = "#5a4649"

# No Kvantum theme of its own: glass colours one from this palette.
[style]
glass = "frosted"

[icons]
theme = "Papirus-Dark"
folder_color = "carmine"

[cursor]
name = "Bibata-Original-Amber"
url = "https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Original-Amber.tar.xz"
size = 24

[fonts]
ui = "Noto Sans"
ui_size = 10
mono = "Fira Code"
mono_size = 10
packages = ["noto-fonts", "ttf-fira-code"]

# Islands on top; the dock hides until the mouse reaches the bottom edge.
[[layout.panels]]
edge = "top"
style = "islands"
thickness = 34
widgets = ["launcher", "pager", "spacer", "clock", "spacer", "tray"]

[[layout.panels]]
edge = "bottom"
style = "dock"
thickness = 54
hiding = "autohide"
widgets = ["tasks"]

[panel_style]
radius = 14
opacity = 0.75
border = "accent"
padding = 4
colour = "mantle"

[effects]
blur = true
blur_strength = 10
blur_noise = 5
blur_saturation = 160
open_close = "glide"
minimize = "magiclamp"
desktop_switch = "fade"
fall_apart = true
sheet = true
dim_inactive = 20

[terminal]
opacity = 0.85
blur = true
padding = 14
font_size = 11

[shell]
prompt = "powerline"
zoxide = true
logo = "text"
logo_text = "CRIMSON"
logo_colour = "gradient"

[splash]
style = "plasmify"
background = "palette"
logo = "distro"
text = "Crimson Moon"
progress = true

[wallpaper]
mode = "slideshow"
interval = 1800
shimmer = "starfall"
shimmer_colour = "accent"
shimmer_light = "glint"

