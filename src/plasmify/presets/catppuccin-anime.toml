schema = 1

[meta]
id = "catppuccin-anime"
name = "Catppuccin Anime"
description = "Soothing pastel Mocha palette with rotating lofi anime wallpapers, drifting sakura petals and a floating dock."
tags = ["pastel", "anime", "lofi", "dark"]

# https://github.com/catppuccin/palette (MIT)
[palette]
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
surface = "#313244"
overlay = "#6c7086"
text = "#cdd6f4"
subtext = "#a6adc8"
accent = "#cba6f7"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
orange = "#fab387"
bright_black = "#585b70"

[style.kvantum]
repo = "https://github.com/catppuccin/kvantum"
path = "themes/catppuccin-mocha-mauve"
name = "catppuccin-mocha-mauve"

[icons]
theme = "Papirus-Dark"
folder_color = "cat-mocha-mauve"
folder_source = { repo = "https://github.com/catppuccin/papirus-folders", path = "src" }

[cursor]
name = "catppuccin-mocha-mauve-cursors"
url = "https://github.com/catppuccin/cursors/releases/download/v2.0.0/catppuccin-mocha-mauve-cursors.zip"
size = 24

[fonts]
ui = "Inter"
ui_size = 10
mono = "JetBrains Mono"
mono_size = 10
packages = ["inter-font", "ttf-jetbrains-mono"]

[layout]
name = "topbar-dock"
launcher_icon = "https://raw.githubusercontent.com/catppuccin/catppuccin/main/assets/logos/exports/1544x1544_circle.png"

[effects]
blur = true
blur_strength = 10
open_close = "scale"
minimize = "magiclamp"
desktop_switch = "slide"

[terminal]
opacity = 0.85
blur = true
padding = 14
font_size = 12

[shell]
prompt = "powerline"
zoxide = true
fastfetch_logo = "https://raw.githubusercontent.com/catppuccin/catppuccin/main/assets/logos/exports/1544x1544_circle.png"

[wallpaper]
mode = "slideshow"
interval = 1800
shimmer = "petals"
shimmer_colour = "magenta"

[[wallpaper.images]]
url = "https://raw.githubusercontent.com/orangci/walls-catppuccin-mocha/master/girl-stars.png"
credit = "girl-stars.png, from the orangci/walls-catppuccin-mocha collection (original artist uncredited)"

