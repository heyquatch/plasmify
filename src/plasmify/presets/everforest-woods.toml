schema = 1

[meta]
id = "everforest-woods"
name = "Everforest Woods"
description = "Soft green forest tones, misty woodland wallpapers and a calm side bar of islands. Easy on the eyes for long reading sessions."
tags = ["forest", "green", "calm", "dark"]

# https://github.com/sainnhe/everforest (MIT), dark palette with "medium" contrast (palette.md).
# Everforest has nothing darker than bg_dim, so crust borrows bg_dim from the "hard" contrast.
[palette]
base = "#2d353b"
mantle = "#232a2e"
crust = "#1e2326"
surface = "#3d484d"
overlay = "#7a8478"
text = "#d3c6aa"
subtext = "#9da9a0"
accent = "#a7c080"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
orange = "#e69875"
bright_black = "#859289"

[icons]
theme = "Papirus-Dark"
folder_color = "green"

[cursor]
name = "Bibata-Original-Ice"
url = "https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Original-Ice.tar.xz"
size = 24

[fonts]
ui = "Inter"
ui_size = 11
mono = "Fira Code"
mono_size = 11
packages = ["inter-font", "ttf-fira-code"]

# Islands down the left edge: menu and desktops at the top, open apps in the middle,
# tray and clock at the bottom.
[[layout.panels]]
edge = "left"
style = "islands"
thickness = 48
widgets = ["launcher", "pager", "spacer", "tasks", "spacer", "tray", "clock"]

[panel_style]
radius = 16
opacity = 0.9
border = "subtle"
padding = 4
colour = "mantle"

[effects]
blur = true
blur_strength = 8
open_close = "fade"
minimize = "squash"
desktop_switch = "fade"
animation_speed = 1.5

[terminal]
opacity = 0.94
blur = true
padding = 14
font_size = 12

[shell]
prompt = "minimal"
zoxide = true
fastfetch_logo = "distro"

# Links into krishna4a6av/Wallpapers (which moves files around) and AngelJumbo point at one commit.
[wallpaper]
mode = "slideshow"
interval = 3600

