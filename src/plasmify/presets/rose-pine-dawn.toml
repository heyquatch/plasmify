url = "https://raw.githubusercontent.com/rose-pine/wallpapers/main/illustration/block-wave-dawn.png"
credit = "Block Wave Dawn by ng-hai, via rose-pine/wallpapers"

[[wallpaper.images]]
url = "https://raw.githubusercontent.com/rose-pine/wallpapers/main/photography/kainoa-kanter/ocean-drone-1.jpg"
